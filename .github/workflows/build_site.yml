# Build and deploy the pkgdown site to GitHub Pages.
# Adapted from the pkgdown steps in bioconductor/workflows
# (.github/workflows/bioccheck.yml), which only deploy from RELEASE_*
# branches; this package has no release branches, so it deploys from devel.
# Requires Settings > Pages > Source: "GitHub Actions".
name: Build and deploy site

on:
  push:
    branches: [ devel ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: bioconductor/bioconductor_docker:devel
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: 'true'
      GITHUB_PAT: ${{ github.token }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Query R Dependencies
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest", BiocManager::repositories()))
          if (!requireNamespace("remotes", quietly = TRUE)) install.packages("remotes")
          deps <- remotes::dev_package_deps(".", dependencies = TRUE)
          saveRDS(deps, ".github/depends.Rds")
          writeLines(sprintf("R-%s.%i", R.version$major, floor(as.numeric(R.version$minor))), ".github/R-version")

      - name: Cache R Packages
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/R/site-library
          key: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-pkgdown-1-${{ hashFiles('.github/depends.Rds') }}
          restore-keys: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-pkgdown-1-

      - name: Install Package and pkgdown
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest", BiocManager::repositories()))
          remotes::install_local(".", dependencies = TRUE, Ncpus = parallel::detectCores())
          BiocManager::install("pkgdown", Ncpus = parallel::detectCores())

      - name: Build pkgdown Site
        shell: Rscript {0}
        run: |
          pkgdown::build_site(new_process = FALSE, install = FALSE)

      - name: Upload pkgdown artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
